version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_PRIVATE_URL=postgresql://postgres:postgres@db:5432/vitaldiary
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      - db
    volumes:
      # Optional: mount local sqlite file if not using Postgres
      - ./vitaldiary.db:/app/vitaldiary.db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vitaldiary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
